# AWS の設定（infra/）と API のコード（api/）の自動チェックと自動公開。
# API のコードは Lambda にまとめて載せるので、api/ が変わったときも動く。
# - PR を出したとき・main に入ったとき：型チェック → テスト → テンプレート作成
# - main に入ったときだけ：チェックが通ったら AWS に反映（鍵なし＝OIDC）
name: infra

on:
  pull_request:
    paths: ["infra/**", "api/**", ".github/workflows/infra.yml"]
  push:
    branches: [main]
    paths: ["infra/**", "api/**", ".github/workflows/infra.yml"]
  workflow_dispatch: # 手動でも動かせる

# 公開が同時に2つ走らないようにする
concurrency:
  group: infra-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: infra

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: infra/package-lock.json
      - uses: actions/setup-python@v7 # Lambda のコードをまとめるときに使う
        with:
          python-version: "3.13"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx cdk synth --quiet

  deploy:
    needs: check
    # main に入ったときだけ。ロールの登録がまだなら飛ばす
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.AWS_DEPLOY_ROLE_ARN != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # GitHub の身分証（OIDCトークン）をもらうのに必要
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: infra/package-lock.json
      - uses: actions/setup-python@v7 # Lambda のコードをまとめるときに使う
        with:
          python-version: "3.13"
      - run: npm ci
      - name: AWS に鍵なしで入る
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-2
      - name: 本体スタックを反映
        run: npx cdk deploy Shinkoku --require-approval never
