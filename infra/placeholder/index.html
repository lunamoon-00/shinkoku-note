<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>申告ノート</title>
  <style>
    :root { --bg: #f7f5fb; --text: #2b2440; --sub: #6b6385; --accent: #8b74d6; }
    @media (prefers-color-scheme: dark) { :root { --bg: #17141f; --text: #ece8f7; --sub: #a9a2c0; --accent: #b3a1ee; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text);
           font-family: system-ui, "Hiragino Sans", "Noto Sans JP", sans-serif; padding: 16px; box-sizing: border-box; }
    main { text-align: center; }
    h1 { font-size: 1.75rem; margin: 0 0 .5rem; }
    p { color: var(--sub); margin: 0; line-height: 1.7; }
    .dot { display: inline-block; width: .6rem; height: .6rem; border-radius: 50%; background: var(--accent); margin-right: .4rem; }
  </style>
</head>
<body>
  <main>
    <h1>申告ノート</h1>
    <p><span class="dot"></span>ただいま準備中です</p>
  </main>
</body>
</html>
